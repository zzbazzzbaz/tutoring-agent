name: teaching-agent

services:
  # ===== Data stores =====
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: tutoring
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: tutoring_db
    ports:
      - "15423:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in deploy/.env}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "17457:7474"
      - "17864:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test:
        ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$(printf %s \"$$NEO4J_AUTH\" | cut -d/ -f2)\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 1s
      retries: 5

  # ===== Knowledge base =====
  lightrag:
    image: ghcr.io/hkuds/lightrag:v1.4.10
    restart: unless-stopped
    environment:
      WORKSPACE: workspace-1
      LIGHTRAG_KV_STORAGE: PGKVStorage
      LIGHTRAG_VECTOR_STORAGE: PGVectorStorage
      LIGHTRAG_GRAPH_STORAGE: Neo4JStorage
      LIGHTRAG_DOC_STATUS_STORAGE: PGDocStatusStorage
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: tutoring
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DATABASE: tutoring_db
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in deploy/.env}
      NEO4J_DATABASE: neo4j
      LLM_BINDING: openai
      LLM_MODEL: ${LLM_MODEL:?Set LLM_MODEL in deploy/.env}
      LLM_BINDING_HOST: ${DASHSCOPE_BASE_URL:?Set DASHSCOPE_BASE_URL in deploy/.env}
      LLM_BINDING_API_KEY: ${DASHSCOPE_API_KEY:?Set DASHSCOPE_API_KEY in deploy/.env}
      EMBEDDING_BINDING: openai
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?Set EMBEDDING_MODEL in deploy/.env}
      EMBEDDING_DIM: ${EMBEDDING_DIM:?Set EMBEDDING_DIM in deploy/.env}
      EMBEDDING_BINDING_HOST: ${DASHSCOPE_BASE_URL:?Set DASHSCOPE_BASE_URL in deploy/.env}
      EMBEDDING_BINDING_API_KEY: ${DASHSCOPE_API_KEY:?Set DASHSCOPE_API_KEY in deploy/.env}
      SUMMARY_LANGUAGE: Chinese
    ports:
      - "19621:9621"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  # ===== Business API =====
  api_server:
    build:
      context: ../services/api_server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://tutoring:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/tutoring_db
      LIGHTRAG_BASE_URL: http://lightrag:9621
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health'))['status'] == 'healthy'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ===== Agent runtime =====
  agent_server:
    build:
      context: ../services/agent_server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_URI: postgresql://tutoring:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/tutoring_agent_server_db?sslmode=disable
      REDIS_URI: redis://redis:6379
      BACKEND_INTERNAL_URL: http://api_server:8000
      LIGHTRAG_QUERY_URL: http://lightrag:9621/query
    ports:
      - "2024:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api_server:
        condition: service_healthy
      lightrag:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ok')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===== Web frontend =====
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      api_server:
        condition: service_healthy
      agent_server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  neo4jdata:
  redisdata:
