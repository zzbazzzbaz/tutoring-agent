name: teaching-agent

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${API_DATABASE_NAME:?Set API_DATABASE_NAME in deploy/.env}
    ports:
      - "${POSTGRES_HOST_PORT:?Set POSTGRES_HOST_PORT in deploy/.env}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in deploy/.env}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "${NEO4J_BROWSER_PORT:?Set NEO4J_BROWSER_PORT in deploy/.env}:7474"
      - "${NEO4J_BOLT_PORT:?Set NEO4J_BOLT_PORT in deploy/.env}:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test:
        ["CMD-SHELL", "cypher-shell -u neo4j -p $$NEO4J_PASSWORD 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    restart: unless-stopped
    environment:
      WORKSPACE: workspace-1
      LIGHTRAG_KV_STORAGE: PGKVStorage
      LIGHTRAG_VECTOR_STORAGE: PGVectorStorage
      LIGHTRAG_GRAPH_STORAGE: Neo4JStorage
      LIGHTRAG_DOC_STATUS_STORAGE: PGDocStatusStorage
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DATABASE: ${API_DATABASE_NAME:?Set API_DATABASE_NAME in deploy/.env}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in deploy/.env}
      NEO4J_DATABASE: neo4j
      LLM_BINDING: openai
      LLM_MODEL: ${LLM_MODEL:?Set LLM_MODEL in deploy/.env}
      LLM_BINDING_HOST: ${DASHSCOPE_BASE_URL:?Set DASHSCOPE_BASE_URL in deploy/.env}
      LLM_BINDING_API_KEY: ${DASHSCOPE_API_KEY:?Set DASHSCOPE_API_KEY in deploy/.env}
      EMBEDDING_BINDING: openai
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?Set EMBEDDING_MODEL in deploy/.env}
      EMBEDDING_DIM: ${EMBEDDING_DIM:?Set EMBEDDING_DIM in deploy/.env}
      EMBEDDING_BINDING_HOST: ${DASHSCOPE_BASE_URL:?Set DASHSCOPE_BASE_URL in deploy/.env}
      EMBEDDING_BINDING_API_KEY: ${DASHSCOPE_API_KEY:?Set DASHSCOPE_API_KEY in deploy/.env}
      SUMMARY_LANGUAGE: Chinese
    ports:
      - "${LIGHTRAG_HOST_PORT:?Set LIGHTRAG_HOST_PORT in deploy/.env}:9621"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  api_server:
    build:
      context: ../services/api_server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?Set POSTGRES_USER in deploy/.env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${API_DATABASE_NAME:?Set API_DATABASE_NAME in deploy/.env}
      AGENT_SERVER_SECRET: ${AGENT_SERVER_SECRET:?Set AGENT_SERVER_SECRET in deploy/.env}
    ports:
      - "${API_SERVER_HOST_PORT:?Set API_SERVER_HOST_PORT in deploy/.env}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health'))['status'] == 'healthy'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  langgraph_redis:
    image: redis:6
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 1s
      retries: 5

  agent_server:
    build:
      context: ../services/agent_server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_URI: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in deploy/.env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${LANGGRAPH_DATABASE_NAME:?Set LANGGRAPH_DATABASE_NAME in deploy/.env}?sslmode=disable
      REDIS_URI: redis://langgraph_redis:6379
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?Set DASHSCOPE_API_KEY in deploy/.env}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:?Set DASHSCOPE_BASE_URL in deploy/.env}
      LLM_MODEL: ${LLM_MODEL:?Set LLM_MODEL in deploy/.env}
      BACKEND_INTERNAL_URL: http://api_server:8000
      AGENT_SERVER_SECRET: ${AGENT_SERVER_SECRET:?Set AGENT_SERVER_SECRET in deploy/.env}
      LIGHTRAG_QUERY_URL: http://lightrag:9621/query
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:?Set CORS_ALLOW_ORIGINS in deploy/.env}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:?Set LANGSMITH_TRACING in deploy/.env}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:?Set LANGSMITH_ENDPOINT in deploy/.env}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY?Set LANGSMITH_API_KEY in deploy/.env}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:?Set LANGSMITH_PROJECT in deploy/.env}
    ports:
      - "${AGENT_SERVER_HOST_PORT:?Set AGENT_SERVER_HOST_PORT in deploy/.env}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      langgraph_redis:
        condition: service_healthy
      api_server:
        condition: service_healthy
      lightrag:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ok')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  neo4jdata:
