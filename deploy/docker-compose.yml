services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: teaching-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tutoring
      POSTGRES_PASSWORD: tutoring123456
      POSTGRES_DB: tutoring_db
    ports:
      - "15423:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutoring -d tutoring_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.26-community
    container_name: teaching-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/tutoring123456
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "17457:7474"
      - "17864:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p tutoring123456 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  lightrag:
    image: ghcr.io/hkuds/lightrag:v1.4.10
    container_name: teaching-lightrag
    restart: unless-stopped
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      ALL_PROXY: ""
      all_proxy: ""
      NO_PROXY: "*"
      WORKSPACE: "workspace-1"
      LIGHTRAG_KV_STORAGE: PGKVStorage
      LIGHTRAG_VECTOR_STORAGE: PGVectorStorage
      LIGHTRAG_GRAPH_STORAGE: Neo4JStorage
      LIGHTRAG_DOC_STATUS_STORAGE: PGDocStatusStorage
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: tutoring
      POSTGRES_PASSWORD: tutoring123456
      POSTGRES_DATABASE: tutoring_db
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: tutoring123456
      NEO4J_DATABASE: neo4j
      LLM_BINDING: openai
      LLM_MODEL: qwen3.6-flash
      LLM_BINDING_HOST: https://dashscope.aliyuncs.com/compatible-mode/v1
      LLM_BINDING_API_KEY: sk-cad2e2400e384fc7aa08846770dac9e1
      EMBEDDING_BINDING: openai
      EMBEDDING_MODEL: text-embedding-v4
      EMBEDDING_DIM: 1024
      EMBEDDING_BINDING_HOST: https://dashscope.aliyuncs.com/compatible-mode/v1
      EMBEDDING_BINDING_API_KEY: sk-cad2e2400e384fc7aa08846770dac9e1
      SUMMARY_LANGUAGE: Chinese
    ports:
      - "19621:9621"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

volumes:
  pgdata:
  neo4jdata:
