services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: teaching-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tutoring
      POSTGRES_PASSWORD: tutoring123456
      POSTGRES_DB: tutoring_db
    ports:
      - "15423:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutoring -d tutoring_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.26-community
    container_name: teaching-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/tutoring123456
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "17457:7474"
      - "17864:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p tutoring123456 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pgdata:
  neo4jdata:
