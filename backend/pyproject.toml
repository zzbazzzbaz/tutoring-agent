[project]
name = "tutoring"
version = "0.2.0"
description = "Teaching Agent backend (FastAPI + LightRAG + LangChain 1.x)"
requires-python = ">=3.13"
dependencies = [
    # ---- Web 框架与服务 ----
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    # ---- LangChain / LangGraph 生态 ----
    "langchain>=1.3",
    "langgraph>=1.2",
    "langgraph-sdk>=0.1",
    "langgraph-checkpoint-postgres>=3.1",
    "langchain-openai>=1.3",
    # ---- 数据校验与配置 ----
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # ---- 数据库 / ORM ----
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "greenlet>=3.0",
    # ---- RAG / 知识图谱 ----
    "lightrag-hku>=1.5.4",
    "pgvector>=0.5.0",
    "neo4j>=6.2.0",
    # ---- 认证 ----
    "bcrypt>=4.0",
    # ---- 文件处理 ----
    "openpyxl>=3.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tutoring"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    # ---- 测试框架 ----
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # ---- 测试工具 ----
    "httpx>=0.27",
    "asgi-lifespan>=2.1",
    # ---- LangGraph Server 本地开发 ----
    "langgraph-cli[inmem]>=0.1",
]
