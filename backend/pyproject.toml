[project]
name = "tutoring"
version = "0.2.0"
description = "Teaching Agent backend (FastAPI + LightRAG + LangChain 1.x)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "langchain>=1.3",
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.1",
    "langchain-openai>=1.3",
    "sqlmodel>=0.0.22",
    "greenlet>=3.0",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "bcrypt>=4.0",
    "lightrag-hku>=1.5.4",
    "pgvector>=0.5.0",
    "neo4j>=6.2.0",
    "openpyxl>=3.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tutoring"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "asgi-lifespan>=2.1",
]
