<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教学 Agent 测试</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font: 14px/1.6 -apple-system, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #333; }
.app { display: flex; height: 100vh; }
.sidebar { width: 280px; background: #fff; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; }
.main { flex: 1; display: flex; flex-direction: column; }
.sidebar-header { padding: 16px; border-bottom: 1px solid #e0e0e0; }
.sidebar-header h1 { font-size: 16px; margin-bottom: 12px; }
.config-row { margin-bottom: 8px; }
.config-row label { display: block; font-size: 12px; color: #888; margin-bottom: 2px; }
.config-row input, .config-row select { width: 100%; padding: 6px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; }
.btn { padding: 6px 14px; border: 1px solid #ddd; background: #fff; border-radius: 4px; cursor: pointer; font-size: 13px; }
.btn:hover { background: #f0f0f0; }
.btn-primary { background: #4a90d9; color: #fff; border-color: #4a90d9; }
.btn-primary:hover { background: #357abd; }
.btn-sm { padding: 3px 10px; font-size: 12px; }
.session-list { flex: 1; overflow-y: auto; padding: 8px; }
.session-item { padding: 10px 12px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; border: 1px solid transparent; }
.session-item:hover { background: #f5f5f5; }
.session-item.active { background: #e8f0fe; border-color: #4a90d9; }
.session-item .meta { font-size: 11px; color: #999; margin-top: 2px; }
.session-item .badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; margin-right: 4px; }
.badge-free { background: #e0e0e0; color: #666; }
.badge-project { background: #fce8e6; color: #d93025; }
.badge-ended { background: #fef7e0; color: #b06000; }
.chat-header { padding: 12px 20px; border-bottom: 1px solid #e0e0e0; background: #fff; display: flex; align-items: center; justify-content: space-between; }
.chat-header .title { font-weight: 600; font-size: 14px; }
.chat-header .actions { display: flex; gap: 8px; }
.messages { flex: 1; overflow-y: auto; padding: 20px; }
.msg { margin-bottom: 16px; max-width: 80%; }
.msg-user { margin-left: auto; }
.msg-user .bubble { background: #4a90d9; color: #fff; }
.msg-agent .bubble { background: #fff; border: 1px solid #e0e0e0; }
.msg .bubble { padding: 10px 14px; border-radius: 12px; display: inline-block; max-width: 100%; word-wrap: break-word; white-space: pre-wrap; }
.msg .role { font-size: 11px; color: #999; margin-bottom: 2px; }
.msg-user .role { text-align: right; }
.quiz-card { background: #fff8e1; border: 1px solid #ffc107; border-radius: 8px; padding: 16px; margin: 16px 0; max-width: 80%; }
.quiz-card .quiz-title { font-weight: 600; margin-bottom: 8px; color: #e65100; }
.quiz-card .quiz-stem { margin-bottom: 12px; line-height: 1.6; }
.quiz-card .quiz-options { margin-bottom: 12px; }
.quiz-card .quiz-option { padding: 6px 10px; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 4px; cursor: pointer; }
.quiz-card .quiz-option:hover { background: #f0f0f0; }
.quiz-card .quiz-option.selected { background: #e8f0fe; border-color: #4a90d9; }
.quiz-card .quiz-actions { display: flex; gap: 8px; margin-top: 12px; }
.quiz-card input[type="text"] { flex: 1; padding: 6px 10px; border: 1px solid #ddd; border-radius: 4px; }
.input-area { padding: 12px 20px; border-top: 1px solid #e0e0e0; background: #fff; display: flex; gap: 8px; }
.input-area textarea { flex: 1; padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; resize: none; font-size: 14px; min-height: 40px; max-height: 120px; }
.empty-state { display: flex; align-items: center; justify-content: center; flex: 1; color: #999; font-size: 14px; }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
.status-idle { background: #ccc; }
.status-streaming { background: #4caf50; animation: pulse 1s infinite; }
.status-interrupted { background: #ff9800; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.new-session-area { padding: 12px 16px; border-top: 1px solid #e0e0e0; }
.new-session-area select { width: 100%; padding: 6px; margin-bottom: 8px; border: 1px solid #ddd; border-radius: 4px; }
.error-msg { color: #d93025; font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>教学 Agent</h1>
      <div class="config-row">
        <label>API 地址</label>
        <input type="text" id="apiBase" value="http://localhost:8000" />
      </div>
      <div class="config-row">
        <label>用户 ID</label>
        <input type="text" id="userId" value="demo-student" />
      </div>
    </div>
    <div class="session-list" id="sessionList">
      <div style="text-align:center;color:#999;padding:20px 0;">点击下方创建会话</div>
    </div>
    <div class="new-session-area">
      <select id="newSessionMode">
        <option value="free">自由学习模式</option>
        <option value="project">项目模式</option>
      </select>
      <select id="projectSelect" style="display:none;"></select>
      <button class="btn btn-primary btn-sm" id="createSessionBtn" style="width:100%;">新建会话</button>
    </div>
  </div>
  <div class="main">
    <div class="chat-header">
      <div class="title" id="chatTitle">
        <span class="status-dot status-idle" id="statusDot"></span>
        <span id="chatTitleText">未选择会话</span>
      </div>
      <div class="actions" id="chatActions" style="display:none;">
        <button class="btn btn-sm" id="loadHistoryBtn">加载历史</button>
        <button class="btn btn-sm" id="endSessionBtn">结束会话</button>
      </div>
    </div>
    <div class="messages" id="messages">
      <div class="empty-state">选择或创建一个会话开始对话</div>
    </div>
    <div class="input-area" id="inputArea" style="display:none;">
      <textarea id="msgInput" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)" rows="1"></textarea>
      <button class="btn btn-primary" id="sendBtn">发送</button>
    </div>
  </div>
</div>

<script>
const state = {
  apiBase: '',
  userId: '',
  currentSession: null,
  streaming: false,
  interrupted: false,
  projects: [],
};

// === Utility ===
function api(path, options = {}) {
  const url = state.apiBase + path;
  const opts = {
    ...options,
    headers: { 'Content-Type': 'application/json', 'X-User-Id': state.userId, ...(options.headers || {}) },
  };
  return fetch(url, opts);
}

function setStatus(status) {
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot status-' + status;
}

// === Session Management ===
async function loadSessions() {
  try {
    const resp = await api('/sessions?status=active&limit=50');
    const sessions = await resp.json();
    renderSessionList(sessions);
  } catch (e) {
    console.error('加载会话列表失败:', e);
  }
}

async function loadProjects() {
  try {
    const resp = await api('/projects?status=published&limit=100');
    state.projects = await resp.json();
    renderProjectSelect();
  } catch (e) {
    console.error('加载项目列表失败:', e);
  }
}

function renderProjectSelect() {
  const sel = document.getElementById('projectSelect');
  if (state.projects.length === 0) {
    sel.innerHTML = '<option value="">无可用项目（需先发布项目）</option>';
  } else {
    sel.innerHTML = state.projects.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
  }
}

function renderSessionList(sessions) {
  const list = document.getElementById('sessionList');
  if (!sessions || sessions.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:#999;padding:20px 0;">暂无会话</div>';
    return;
  }
  list.innerHTML = sessions.map(s => {
    const active = state.currentSession && state.currentSession.id === s.id;
    const modeBadge = s.mode === 'project'
      ? `<span class="badge badge-project">项目</span>`
      : `<span class="badge badge-free">自由</span>`;
    const endedBadge = s.status === 'ended' ? `<span class="badge badge-ended">已结束</span>` : '';
    const projName = s.project_name ? ` · ${s.project_name}` : '';
    const time = new Date(s.last_active_at).toLocaleString('zh-CN', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
    return `<div class="session-item ${active ? 'active' : ''}" onclick="selectSession('${s.id}')">
      <div>${modeBadge}${endedBadge}${s.title || '会话 ' + s.id.slice(0,8)}${projName}</div>
      <div class="meta">${time}</div>
    </div>`;
  }).join('');
}

async function selectSession(sessionId) {
  if (state.streaming) {
    alert('正在流式响应中，请等待完成');
    return;
  }
  try {
    const resp = await api('/sessions/' + sessionId);
    if (!resp.ok) return;
    state.currentSession = await resp.json();
    state.interrupted = false;
    renderChatHeader();
    document.getElementById('messages').innerHTML = '';
    document.getElementById('inputArea').style.display = 'flex';
    document.getElementById('chatActions').style.display = 'flex';
    setStatus('idle');
    await loadSessions();
  } catch (e) {
    console.error('选择会话失败:', e);
  }
}

function renderChatHeader() {
  const s = state.currentSession;
  if (!s) return;
  const modeBadge = s.mode === 'project' ? '[项目] ' : '[自由] ';
  const projName = s.project_name ? ' · ' + s.project_name : '';
  document.getElementById('chatTitleText').textContent = modeBadge + '会话 ' + s.id.slice(0,8) + projName;
}

async function createSession() {
  const mode = document.getElementById('newSessionMode').value;
  let body = { mode };
  if (mode === 'project') {
    const pid = document.getElementById('projectSelect').value;
    if (!pid) {
      alert('请先选择一个已发布的项目');
      return;
    }
    body.project_id = pid;
  }
  try {
    const resp = await api('/sessions', { method: 'POST', body: JSON.stringify(body) });
    if (!resp.ok) {
      const err = await resp.json();
      alert('创建会话失败: ' + (err.detail?.error?.message || JSON.stringify(err)));
      return;
    }
    const sess = await resp.json();
    state.currentSession = sess;
    state.interrupted = false;
    renderChatHeader();
    document.getElementById('messages').innerHTML = '';
    document.getElementById('inputArea').style.display = 'flex';
    document.getElementById('chatActions').style.display = 'flex';
    setStatus('idle');
    await loadSessions();
  } catch (e) {
    alert('创建会话失败: ' + e.message);
  }
}

async function endSession() {
  if (!state.currentSession) return;
  if (!confirm('确定结束此会话？结束后无法继续对话。')) return;
  try {
    await api('/sessions/' + state.currentSession.id, { method: 'DELETE' });
    state.currentSession = null;
    document.getElementById('messages').innerHTML = '<div class="empty-state">会话已结束</div>';
    document.getElementById('inputArea').style.display = 'none';
    document.getElementById('chatActions').style.display = 'none';
    document.getElementById('chatTitleText').textContent = '未选择会话';
    setStatus('idle');
    await loadSessions();
  } catch (e) {
    alert('结束会话失败: ' + e.message);
  }
}

// === Message History ===
async function loadHistory() {
  if (!state.currentSession) return;
  try {
    const resp = await api('/sessions/' + state.currentSession.id + '/messages?limit=100');
    const msgs = await resp.json();
    const container = document.getElementById('messages');
    container.innerHTML = '';
    for (const m of msgs) {
      appendMessage(m.role, m.content);
    }
    // 也加载题目列表
    const qResp = await api('/sessions/' + state.currentSession.id + '/questions');
    const questions = await qResp.json();
    if (questions.length > 0) {
      appendInfoBox(`此会话有 ${questions.length} 道题目（${questions.filter(q=>q.status==='answered').length} 已答，${questions.filter(q=>q.status==='pending').length} 待答，${questions.filter(q=>q.status==='skipped').length} 跳过）`);
    }
  } catch (e) {
    console.error('加载历史失败:', e);
  }
}

// === Chat Streaming ===
function appendMessage(role, content) {
  const container = document.getElementById('messages');
  const empty = container.querySelector('.empty-state');
  if (empty) container.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'msg msg-' + role;
  const roleLabel = role === 'user' ? '你' : 'Agent';
  div.innerHTML = `<div class="role">${roleLabel}</div><div class="bubble"></div>`;
  container.appendChild(div);
  div.querySelector('.bubble').textContent = content;
  container.scrollTop = container.scrollHeight;
  return div.querySelector('.bubble');
}

function appendInfoBox(text) {
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg msg-agent';
  div.innerHTML = `<div class="bubble" style="background:#f0f0f0;font-style:italic;">${text}</div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function appendStreamingMessage() {
  const container = document.getElementById('messages');
  const empty = container.querySelector('.empty-state');
  if (empty) container.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'msg msg-agent';
  div.innerHTML = `<div class="role">Agent</div><div class="bubble"></div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return div.querySelector('.bubble');
}

function appendQuizCard(payload) {
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'quiz-card';
  div.id = 'quiz-card-' + payload.question_id;

  let optionsHtml = '';
  if (payload.options && payload.options.length > 0) {
    optionsHtml = '<div class="quiz-options">';
    payload.options.forEach((opt, i) => {
      optionsHtml += `<div class="quiz-option" onclick="selectQuizOption(this, '${payload.question_id}')">${opt}</div>`;
    });
    optionsHtml += '</div>';
  }

  div.innerHTML = `
    <div class="quiz-title">📝 题目 · ${payload.topic} · ${payload.q_type}</div>
    <div class="quiz-stem">${payload.stem}</div>
    ${optionsHtml}
    <div class="quiz-actions">
      <input type="text" id="quiz-answer-${payload.question_id}" placeholder="输入你的答案..." />
      <button class="btn btn-primary btn-sm" onclick="submitQuizAnswer('${payload.question_id}', 'answer')">提交答案</button>
      <button class="btn btn-sm" onclick="submitQuizAnswer('${payload.question_id}', 'skip')">跳过</button>
    </div>
  `;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function selectQuizOption(el, questionId) {
  const card = document.getElementById('quiz-card-' + questionId);
  card.querySelectorAll('.quiz-option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('quiz-answer-' + questionId).value = el.textContent;
}

async function sendMessage() {
  if (!state.currentSession || state.streaming) return;
  const input = document.getElementById('msgInput');
  const content = input.value.trim();
  if (!content) return;

  input.value = '';
  input.style.height = 'auto';
  appendMessage('user', content);

  state.streaming = true;
  state.interrupted = false;
  document.getElementById('sendBtn').disabled = true;
  setStatus('streaming');

  try {
    const resp = await fetch(state.apiBase + '/chat/sessions/' + state.currentSession.id + '/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-User-Id': state.userId },
      body: JSON.stringify({ content }),
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({detail: resp.statusText}));
      appendInfoBox('❌ 错误: ' + (err.detail?.error?.message || JSON.stringify(err)));
      return;
    }

    await handleSSEStream(resp);
  } catch (e) {
    appendInfoBox('❌ 网络错误: ' + e.message);
  } finally {
    state.streaming = false;
    document.getElementById('sendBtn').disabled = false;
    if (!state.interrupted) setStatus('idle');
  }
}

async function submitQuizAnswer(questionId, action) {
  if (state.streaming) return;
  if (!state.currentSession) return;

  let answer = null;
  if (action === 'answer') {
    const input = document.getElementById('quiz-answer-' + questionId);
    answer = input.value.trim();
    if (!answer) {
      alert('请输入答案或选择跳过');
      return;
    }
  }

  // 移除 quiz card
  const card = document.getElementById('quiz-card-' + questionId);
  if (card) {
    card.style.opacity = '0.5';
    card.querySelector('input').disabled = true;
    card.querySelectorAll('button').forEach(b => b.disabled = true);
  }

  state.streaming = true;
  state.interrupted = false;
  document.getElementById('sendBtn').disabled = true;
  setStatus('streaming');

  try {
    const body = { action };
    if (action === 'answer') body.answer = answer;

    const resp = await fetch(state.apiBase + '/chat/sessions/' + state.currentSession.id + '/quiz/resume', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-User-Id': state.userId },
      body: JSON.stringify(body),
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({detail: resp.statusText}));
      appendInfoBox('❌ 错误: ' + (err.detail?.error?.message || JSON.stringify(err)));
      if (card) card.style.opacity = '1';
      return;
    }

    // 移除已处理的 quiz card
    if (card) card.remove();

    await handleSSEStream(resp);
  } catch (e) {
    appendInfoBox('❌ 网络错误: ' + e.message);
    if (card) card.style.opacity = '1';
  } finally {
    state.streaming = false;
    document.getElementById('sendBtn').disabled = false;
    if (!state.interrupted) setStatus('idle');
  }
}

async function handleSSEStream(resp) {
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let currentBubble = null;

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;

    buffer += decoder.decode(value, { stream: true });
    const blocks = buffer.split('\n\n');
    buffer = blocks.pop();

    for (const block of blocks) {
      if (!block.trim()) continue;
      let eventType = null;
      let data = null;
      for (const line of block.split('\n')) {
        if (line.startsWith('event: ')) eventType = line.slice(7);
        else if (line.startsWith('data: ')) {
          try { data = JSON.parse(line.slice(6)); } catch { data = line.slice(6); }
        }
      }
      if (!eventType) continue;

      if (eventType === 'text') {
        if (!currentBubble) currentBubble = appendStreamingMessage();
        currentBubble.textContent += data.content;
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
      } else if (eventType === 'quiz_interrupt') {
        state.interrupted = true;
        setStatus('interrupted');
        appendQuizCard(data);
        currentBubble = null;
      } else if (eventType === 'done') {
        currentBubble = null;
      } else if (eventType === 'error') {
        appendInfoBox('❌ ' + (data.message || '未知错误') + ' (' + (data.code || '') + ')');
        currentBubble = null;
      }
    }
  }
}

// === Event Listeners ===
document.getElementById('sendBtn').addEventListener('click', sendMessage);

document.getElementById('msgInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

document.getElementById('msgInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

document.getElementById('createSessionBtn').addEventListener('click', createSession);

document.getElementById('endSessionBtn').addEventListener('click', endSession);

document.getElementById('loadHistoryBtn').addEventListener('click', loadHistory);

document.getElementById('newSessionMode').addEventListener('change', (e) => {
  document.getElementById('projectSelect').style.display = e.target.value === 'project' ? 'block' : 'none';
});

document.getElementById('apiBase').addEventListener('change', () => {
  state.apiBase = document.getElementById('apiBase').value.replace(/\/$/, '');
  loadSessions();
  loadProjects();
});

document.getElementById('userId').addEventListener('change', () => {
  state.userId = document.getElementById('userId').value;
  loadSessions();
});

// === Init ===
state.apiBase = document.getElementById('apiBase').value.replace(/\/$/, '');
state.userId = document.getElementById('userId').value;
loadSessions();
loadProjects();
</script>
</body>
</html>
